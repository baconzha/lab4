<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab 4</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 20px auto;
        padding: 0 10px;
    }
    h1 {
        font-size: 22px;
    }
    h2 {
        font-size: 18px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 4px;
    }
    table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 30px;
    }
    th, td {
        border: 1px solid #999;
        padding: 6px 10px;
        text-align: left;
    }
    th {
        background: #eee;
    }
</style>
</head>
<body>

<h1>Lab 4 - XML and JSON</h1>

<h2>Books (from book.xml)</h2>
<table id="bookTable">
    <tr>
        <th>ID</th><th>Title</th><th>Author</th><th>Price</th>
    </tr>
</table>

<h2>User Profiles (from userProfiles.json)</h2>
<table id="userTable">
    <tr>
        <th>Name</th><th>Email</th><th>Date of Birth</th><th>Address</th><th>Preferences</th>
    </tr>
</table>

<script>
// part 1: load xml
fetch('book.xml')
    .then(function(res) { return res.text(); })
    .then(function(text) {
        var doc = new DOMParser().parseFromString(text, 'application/xml');
        var books = doc.getElementsByTagName('book');
        var table = document.getElementById('bookTable');
        for (var i = 0; i < books.length; i++) {
            var row = table.insertRow();
            row.insertCell().textContent = books[i].getAttribute('id');
            row.insertCell().textContent = books[i].getElementsByTagName('title')[0].textContent;
            row.insertCell().textContent = books[i].getElementsByTagName('author')[0].textContent;
            row.insertCell().textContent = '$' + books[i].getElementsByTagName('price')[0].textContent;
        }
    });

// part 2: load json
fetch('userProfiles.json')
    .then(function(res) { return res.json(); })
    .then(function(users) {
        var table = document.getElementById('userTable');
        users.forEach(function(u) {
            var row = table.insertRow();
            row.insertCell().textContent = u.firstName + ' ' + u.lastName;
            row.insertCell().textContent = u.email;
            row.insertCell().textContent = u.dateOfBirth;
            var a = u.address;
            row.insertCell().textContent = a.street + ', ' + a.city + ', ' + a.state + ' ' + a.zipCode;
            var p = u.userPreferences;
            row.insertCell().textContent = p.theme + ' / ' + p.language +
                ' / notifications:' + p.notifications + ' / subscribed:' + p.subscription;
        });
    });
</script>

</body>
</html>
